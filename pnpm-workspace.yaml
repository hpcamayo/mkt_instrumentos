allowBuilds:
  sharp: true
  unrs-resolver: true

# Security floors for transitive dependencies (launch audit A07). next@15.5.28 pins postcss 8.4.31 and resolves
# sharp 0.34; both are inside the ranges next supports, so these only lift them to the patched releases. The second
# group lifts build and lint tooling (eslint, autoprefixer, tailwindcss) to patched releases of the same majors.
overrides:
  sharp: ^0.35.5
  postcss: ^8.5.31
  nanoid: ^3.3.20
  source-map-js: ^1.2.2
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  js-yaml@4: ^4.3.2
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  postcss-selector-parser@6: ^6.1.5
