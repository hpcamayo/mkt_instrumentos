# Launch audit A14: the local Supabase that scripts/acceptance/full-stack.sh starts for the end-to-end acceptance run
# (in CI, .github/workflows/acceptance.yml). It copies this file to supabase/config.toml, which the repository doesn't
# track, so a developer's own config is never replaced. Its project id and ports are its own: the CLI names containers
# and data volumes after the project id, so the run never reuses, stops or wipes another local stack, and it can run
# beside one. Auth is set like production where the release-gate cases depend on it: e-mail and phone confirmation on,
# passwords of at least 8 characters, authenticator codes (Admin needs aal2). The limits are raised because the tests
# sign in many throwaway accounts from one address.
project_id = "laria_acceptance"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 1000
sms_sent = 1000
anonymous_users = 1000
token_refresh = 1000
sign_in_sign_ups = 1000
token_verifications = 1000

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Off in production too (Secure password change, read on 27 Oct 2026). The app's password form has no reauthentication
# step, so with it on, an account signed in more than 24 hours ago couldn't change its password.
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Production confirms neither addresses nor phone numbers on its own (mailer_autoconfirm and sms_autoconfirm are off,
# read on 27 Oct 2026), and Supabase answers a repeated sign-up according to both. Without this, the CLI would confirm
# phone numbers on its own.
[auth.sms]
enable_signup = false
enable_confirmations = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
